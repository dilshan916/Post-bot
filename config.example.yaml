# ============================================================
# RedditDaily-Bot — Master Configuration Example
# ============================================================
# Copy this file to 'config.yaml' and fill in your credentials.
# All paths are relative to the project root unless absolute.
# ============================================================

# ----------------------------------------------------------
# Reddit RSS Scraper Config (Keyless public feeds)
# ----------------------------------------------------------
reddit:
  client_id: "YOUR_CLIENT_ID"
  client_secret: "YOUR_CLIENT_SECRET"
  user_agent: "RedditDailyBot/1.0 by YourRedditUsername"
  # Target subreddits to scrape stories from
  subreddits:
    - "TrueOffMyChest"
    - "AmItheAsshole"
    - "tifu"
    - "confessions"
    - "relationship_advice"
    - "stories"
    - "maliciouscompliance"
    - "entitledpeople"
    - "pettyrevenge"
    - "familyissues"
    - "prorevenge"
  # Scraping parameters
  sort: "hot" # hot | top | new | rising
  time_filter: "day" # hour | day | week | month | year | all (for 'top' sort)
  post_limit: 25 # Max posts to fetch per subreddit
  min_upvotes: 10 # Minimum score to consider
  min_word_count: 10 # Minimum words in the post body
  max_word_count: 500 # Maximum words (skip novels)

# ----------------------------------------------------------
# LLM Script Rewriting (Optional — leave blank to use regex fallback)
# ----------------------------------------------------------
llm:
  provider: "gemini"
  api_key: "YOUR_GEMINI_API_KEY_HERE"
  api_keys:
    - "YOUR_GEMINI_API_KEY_1"
    - "YOUR_GEMINI_API_KEY_2"
    - "YOUR_GEMINI_API_KEY_3"
  model: "gemini-2.5-flash"
  max_tokens: 2048

# ----------------------------------------------------------
# Groq API (Script Rewriter LLM with Key Rotation)
# ----------------------------------------------------------
groq:
  api_key: "YOUR_PRIMARY_GROQ_API_KEY"
  api_keys:
    - "YOUR_PRIMARY_GROQ_API_KEY"
    - "YOUR_BACKUP_GROQ_API_KEY"
  model: "llama-3.3-70b-versatile"

# ----------------------------------------------------------
# Local Kokoro-82M / Edge-TTS Engine
# ----------------------------------------------------------
tts:
  engine: "kokoro" # "kokoro" | "edge-tts"
  voice: "am_adam" # Default voice for Kokoro
  male_voice: "am_adam"
  female_voice: "af_bella"
  old_male_voice: "bm_george"
  old_female_voice: "af_nicole"
  child_male_voice: "am_puck"
  child_female_voice: "af_sky"
  edge_tts_voice: "en-US-ChristopherNeural"
  edge_tts_female_voice: "en-US-JennyNeural"
  kokoro:
    model_path: "assets/kokoro/kokoro-v0_19.onnx"
    voices_path: "assets/kokoro/voices.bin"
    execution_provider: "CPUExecutionProvider"

# ----------------------------------------------------------
# Acoustic Cadence Settings
# ----------------------------------------------------------
cadence:
  # Pause durations injected by punctuation
  comma_pause_sec: 0.15 # Single comma
  period_pause_sec: 0.45 # Period / sentence break
  dash_pause_sec: 0.75 # Dash / suspense pause

  # Vocal decay hack
  tail_phrase: "THE END." # Appended phrase for natural decay
  room_tone_duration_sec: 1.2 # Replacement silence duration
  room_tone_amplitude: 0.005 # Low-amplitude noise floor

# ----------------------------------------------------------
# Whisper / Vosk Timestamps
# ----------------------------------------------------------
whisper:
  # Primary: whisper-timestamped
  model_size: "medium" # tiny | base | small | medium | large
  language: "en"
  min_vram_gb: 5.0 # Minimum free VRAM to use Whisper GPU
  device: "auto" # auto | cuda | cpu (auto uses GPU if VRAM >= min_vram_gb, else CPU)
  cpu_model_size: "base" # tiny | base | small | medium (use base/tiny on CPU for speed)

  # Fallback: Vosk
  vosk_model: "vosk-model-small-en-us-0.15"
  vosk_model_path: "assets/vosk_model"

# ----------------------------------------------------------
# Subtitle Rendering (Double-Pass)
# ----------------------------------------------------------
subtitles:
  # Font settings
  font_family: "Arial Black" # System font or path in assets/fonts/
  font_size: 95
  font_bold: true
  max_words: 4
  word_zoom_animation: true # Pop-in zoom effect on active highlighted words

  # Passive pass (full sentence)
  passive_color: "#FFFFFF"
  passive_opacity: 1.0
  passive_stroke_color: "#000000"
  passive_stroke_width: 8

  # Active pass (highlighted word)
  active_color: "#FFE500"
  active_opacity: 1.0
  active_stroke_color: "#000000"
  active_stroke_width: 8

  # Position (fraction of frame height from top)
  vertical_position: 0.48

  # Max characters per line before wrapping
  max_chars_per_line: 18

# ----------------------------------------------------------
# Reddit Screenshot Hook
# ----------------------------------------------------------
screenshot:
  enabled: true
  theme: "dark" # dark | light
  display_duration_sec: 3.5 # How long the card is visible
  fade_duration_sec: 0.8 # Fade-out duration
  card_width_pct: 0.88 # Card width as fraction of frame width
  ken_burns: true # Centered slow zoom animation for the title card hook

# ----------------------------------------------------------
# Smart Splitter
# ----------------------------------------------------------
splitter:
  max_duration_sec: 180 # 3 minutes max per part
  words_per_minute: 155 # Average TTS speaking rate
  min_part_duration_sec: 45 # Don't create tiny parts
  watermark_text: "Part {n} of {total}"
  watermark_position: "top-right"
  watermark_font_size: 28
  watermark_color: "#FFFFFF"
  watermark_opacity: 0.7

# ----------------------------------------------------------
# Video Processing & FFmpeg
# ----------------------------------------------------------
video:
  # Output settings
  output_dir: "output"
  resolution:
    width: 1080
    height: 1920
  fps: 30
  codec: "libx264"
  audio_codec: "aac"
  crf: 18 # Quality (lower = better, 18 = visually lossless)
  preset: "medium" # ultrafast | fast | medium | slow | veryslow
  threads: 3 # Number of CPU threads to use for rendering (3 leaves 1 core free for system stability)
  pixel_format: "yuv420p"
  bitrate: "5000k" # Video bitrate (e.g. 5000k for high quality Reels)
  audio_bitrate: "192k" # Audio bitrate (e.g. 192k for high quality stereo audio)

  # Dynamic Multi-Clip Video Stitching (cuts to different gameplay backgrounds every N seconds for max viewer retention)
  multi_clip_stitching: true
  clip_segment_duration: 20.0 # Switch background gameplay clip every 15-25 seconds

  # Gameplay background sources (yt-dlp URLs or local paths)
  gameplay_sources:
    - url: "https://youtu.be/s600FYgI5-s?si=VH1KY-p5GMVejos9"
      label: "gameplay_video_1"
    - url: "https://youtube.com/shorts/qs9cf7_mZow"
      label: "gameplay_video_2"
    - url: "https://youtube.com/shorts/kzxetZaAEBA"
      label: "gameplay_video_3"
    - url: "https://youtube.com/shorts/edSgtjKyFd4"
      label: "gameplay_video_4"
    - url: "https://youtube.com/shorts/v7cMEdbNTYI"
      label: "gameplay_video_5"
    - url: "https://youtube.com/shorts/9wdcl85SvvU"
      label: "gameplay_video_6"
    - url: "https://youtube.com/shorts/1vCccIcUsTw"
      label: "gameplay_video_7"
    - url: "https://youtube.com/shorts/I6DaR7Z2F4I"
      label: "gameplay_video_8"
    # Add local files by placing them in assets/gameplay/
  gameplay_dir: "assets/gameplay"

  # FFmpeg hash destruction filter parameters
  filters:
    # Spatial distortion — intermediate upscale then crop
    scale_width: 1200
    scale_height: 2130
    crop_width: 1080
    crop_height: 1920

    # Chromatic grading
    hue_shift: 0.5 # Degrees
    saturation_mult: 1.02 # 2% boost
    brightness_shift: 0.01 # 1% lift

    # Noise injection
    noise_strength: 2 # alls value
    noise_flags: "t" # temporal noise

    # Audio tempo shift
    audio_tempo: 1.01 # 1% speedup

# ----------------------------------------------------------
# Pipeline Settings
# ----------------------------------------------------------
pipeline:
  batch_size: 1 # Stories per run (override with --batch N)
  temp_dir: "temp" # Temp working directory
  log_dir: "output/logs"
  log_level: "INFO" # DEBUG | INFO | WARNING | ERROR
  scraped_history: "data/scraped_history.json"
  keep_temp_files: false # Set true for debugging
  approve_scripts: false # Set false for 100% automated execution (no manual approval)
  audio_ducking: true # Dynamically adjust background music volume around speaker pauses
  pipeline_mode: "conversational" # Default mode: monologue | conversational
  outro_enabled: true # Append a "Follow for more" audio/visual block at the end of the video
  outro_text: "Follow for more!"

# ----------------------------------------------------------
# Pipeline Mode Configurations
# ----------------------------------------------------------
monologue:
  subreddits:
    - "TrueOffMyChest"
    - "stories"
    - "familyissues"
    - "AmIOverreacting"
    - "Bridezillas"
    - "badroommates"
  voice: "en-US-ChristopherNeural"
  system_prompt: |
    You are a voice actor recording an urgent, deeply personal voice memo. You are NOT an AI assistant, and you are NOT editing a post. You are speaking your raw, unedited personal reality directly into the microphone.

    Strictly enforce these narrative audio rules:

    1. Speak exclusively in the first person ("I", "my", "me").

    2. CRITICAL CLICKBAIT HOOK: The very first sentence MUST hit like a slap — state the most extreme, shocking, or emotionally devastating moment of the story. Start at the climax, betrayal, or conflict. BANNED openers: "I'm still reeling...", "I can't believe...", "I never thought...", "Today...". If the source lacks one clearly extreme moment, lead with the highest-stakes true detail available — do not invent intensity to compensate.

    3. Jump directly into the emotional core within the first sentence. Zero introductory padding, greetings, meta-commentary, or setup transitions.

    4. Expand ALL Reddit acronyms and relationship shorthand into natural spoken phrases (e.g., "AITA" to "am I the jerk", "ex" to "ex-partner", "MIL" to "mother-in-law", "SO" to "partner", "BF/GF" to "boyfriend/girlfriend", "FIL/BIL" to "father-in-law/brother-in-law", "DD/DS" to "daughter/son", "OP" to "I/me"). Infer meaning from context for any shorthand not listed here.

    5. Write in brief, punchy, human sentences (under 20 words per sentence, 15-25 sentences total). Optimized for rapid TTS breathing patterns.

    6. Strip out all editorial markers like "EDIT:", "TL;DR:", or chronological bullet points.

    7. CURIOSITY-GAP BEAT: Include exactly ONE standalone teaser sentence in the FIRST HALF of the monologue that hints a hard choice or discovery is coming without revealing it. This tension must be resolved later in the story — never left unaddressed.

    8. DELAYED ESCALATION REVEAL: Deliver key numbers, costs, or escalating consequences as a standalone sentence before the ending, as a gut-punch.

    9. CRITICAL RESOLUTION ENDING: End the story with its true outcome from the source — what actually happened, what was decided, or how it concluded. The final sentence must feel conclusive and complete. Never end on a question, and never leave the conflict open.

    10. NO INVENTED RESOLUTION: If the source material has no clear ending (unresolved thread, no update from OP), state this honestly as the closing beat rather than fabricating closure.

    11. CAUSAL FLOW: Every sentence between beats must advance cause-and-effect — building on what just happened — not merely restate prior facts.

    12. LENGTH AND COMPLETENESS DISCIPLINE: 15-25 sentences total. Condense every major story beat without skipping any.

    13. NO FABRICATION: Every fact, number, and emotion MUST exist in the original source story.

    CRITICAL CONSTRAINT: Output ONLY the raw spoken script text. No titles, no markdown, no filler.

conversational:
  subreddits:
    - "AmItheAsshole"
    - "texts"
    - "relationship_advice"
    - "AmIOverreacting"
    - "Bridezillas"
    - "badroommates"
  male_voice: "en-US-GuyNeural"
  female_voice: "en-US-MichelleNeural"
  # Speaker Stickers Configuration
  stickers_enabled: true
  male_sticker_path: "assets/stickers/male_neutral.png"
  female_sticker_path: "assets/stickers/female_neutral.png"
  sticker_size: 450
  sticker_y_position: 0.78
  # Static Background Images Configuration (Set to true to use images instead of gameplay videos)
  use_static_backgrounds: false
  male_background_path: "assets/backgrounds/home_male.png"
  female_background_path: "assets/backgrounds/home_female.png"
  old_male_background_path: "assets/backgrounds/home_male.png"
  old_female_background_path: "assets/backgrounds/home_female.png"
  chibi_male_background_path: "assets/backgrounds/home_male.png"
  chibi_female_background_path: "assets/backgrounds/home_female.png"
  system_prompt: |
    You are a dramatic script writer. Convert the following story into a strict structured dialogue format.

    Output a single, well-formatted JSON object with absolutely nothing else.

    JSON STRUCTURE REQUIRED:
    {
      "caption": "A short, viral description under 10 words followed by EXACTLY 5 relevant hashtags",
      "pinned_comment": "A value-driven, organic question based directly on the story's conflict to engage viewers in debate",
      "script": [
        {"speaker": "MALE", "emotion": "angry", "text": "Sentence spoken by adult male character..."},
        {"speaker": "FEMALE", "emotion": "worried", "text": "Sentence spoken by adult female character..."},
        {"speaker": "OLD_MALE", "emotion": "sad", "text": "Sentence spoken by older male character..."},
        {"speaker": "OLD_FEMALE", "emotion": "neutral", "text": "Sentence spoken by older female character..."},
        {"speaker": "CHILD_MALE", "emotion": "crying", "text": "Sentence spoken by child male character..."},
        {"speaker": "CHILD_FEMALE", "emotion": "happy", "text": "Sentence spoken by child female character..."}
      ]
    }

    Rules:

    1. CHARACTER MAPPING: Only use speaker roles (MALE, FEMALE, OLD_MALE, OLD_FEMALE, CHILD_MALE, CHILD_FEMALE) that correspond to actual people described in the source story. Map each real character to the closest-fitting sticker (age/gender). Do NOT invent characters to fill unused roles — a 2-person story should only use 2 speaker roles.

    2. Split the story into 8-12 conversational turns, using only as many distinct speaker roles as the story actually supports.

    3. The dialogue turns must strictly alternate between the speaker roles actually in use (never the same speaker twice in a row).

    4. Assign one of these 15 exact emotion strings per line: neutral, happy, angry, crying, surprised, thinking, explaining, worried, sighing, thumbsup, talking, waving, stressed, lovestruck, sleeping. Choose emotions that genuinely fit the line's content — don't force an emotion that doesn't match just to add variety.

    5. STRUCTURAL HOOK: The first block must open with the conflict or consequence already exploding.

    6. Translate all shorthand into natural spoken phrases (e.g., "AITA" to "am I the jerk", "MIL" to "mother-in-law", "SO" to "partner", "OP" to "I/me"). Infer meaning from context for shorthand not listed here.

    7. CURIOSITY-GAP BEAT: In the first half, insert one standalone teaser line unique to this story, hinting at a hard choice or discovery without revealing it. This must be resolved later — never left unaddressed.

    8. DELAYED ESCALATION REVEAL: Position key statistics, costs, or consequences as a standalone line in the final 2-3 blocks, before the resolution.

    9. CRITICAL RESOLUTION ENDING: The final block must deliver the true outcome from the source story — what actually happened, what was decided, or how it concluded. It must feel conclusive, not open-ended, and must NOT be a question.

    10. NO INVENTED RESOLUTION: If the source story has no clear ending (unresolved thread, no update from OP), the final block should state this honestly rather than fabricating a resolution.

    11. NO FABRICATION: Every fact, number, emotion, and character MUST exist in the original source story. Do not invent details, statistics, or people not present in the source.

    12. CAPTION: Under 10 words + exactly 5 hashtags (2 genre-related, 3 context-related).

    13. PINNED COMMENT: An organic, debate-sparking question tied to the story's conflict and its resolution.

    14. Output ONLY the raw JSON string with no markdown formatting.

# ----------------------------------------------------------
# Thread Mode Config
# ----------------------------------------------------------
thread:
  subreddits:
    - "AskReddit"
    - "AskWomen"
    - "ask"
  post_limit: 5
  max_comments: 4
  min_comment_words: 15
  max_comment_words: 250
  voices:
    - "en-US-ChristopherNeural"
    - "en-US-JennyNeural"
    - "en-US-GuyNeural"
    - "en-US-MichelleNeural"
  system_prompt: |
    You are a professional script compiler. Convert the following Reddit post question and its comment answers into a strict structured compilation format.
    You must output the script in a strict, parsable JSON Array format, mapping roles cleanly:
    [
      {"speaker": "NARRATOR", "voice": "en-US-ChristopherNeural", "author": "reddit_question", "score": 9500, "text": "What is the thread question text here?"},
      {"speaker": "USER_1", "voice": "en-US-GuyNeural", "author": "username1", "score": 1200, "text": "Answer 1..."},
      {"speaker": "USER_2", "voice": "en-US-JennyNeural", "author": "username2", "score": 850, "text": "Answer 2..."}
    ]

    Rules:
    1. The first block must represent the thread question (speaker: "NARRATOR").
    2. Each subsequent block represents a clean, rewritten user comment.
    3. Choose a voice from monologue/conversational voices dynamically for each comment (assigning it to the "voice" field).
    4. Clean all comments of Reddit-specific meta elements (like "EDIT", "TL;DR", "Update").
    5. Translate all text shorthand into full spoken-word phrases (e.g. "AITA" -> "Am I the jerk", "ex" -> "ex-partner").
    6. Ensure the text ends with appropriate sentence punctuation (?, !, or .) so the TTS engine pauses naturally.
    7. Do NOT include markdown formatting like ```json or ```. Output ONLY the raw JSON array string.


# ----------------------------------------------------------
# Fun Riddle Mode Config (Comment-to-Pin System / 30s Loop)
# ----------------------------------------------------------
riddle:
  pure_generation: true # Bypasses Reddit scraping entirely and generates riddles via LLM.
  default_voice: "en-US-ChristopherNeural"
  system_prompt: |
    You are an elite, viral short-form scriptwriter specialized in creating high-retention Facebook Reels for a premium US/UK audience in "Fun Riddle Mode". Your primary objective is to output a flawless JSON object that satisfies 2026 Meta Algorithmic Compliance (UTIS and Anti-Engagement Bait models).

    You must strictly output a single, well-formatted JSON object with absolutely nothing else. Do not include any markdown wrap around headers, intro, or outro text outside the JSON.

    JSON STRUCTURE REQUIRED:
    {
      "answer": "The single-word or short-phrase answer to the riddle",
      "caption": "A punchy, brief description under 10 words followed by EXACTLY 5 relevant hashtags",
      "pinned_comment": "A value-driven, highly specific question based directly on the riddle content to engage viewers organically",
      "script": [
        {"speaker": "MALE", "emotion": "excited", "text": "The opening hook line stating the riddle's stakes or twist setup"},
        {"speaker": "FEMALE", "emotion": "curious", "text": "Reaction or prompt for clues"},
        {"speaker": "MALE", "emotion": "explaining", "text": "The riddle clues delivered clearly"},
        {"speaker": "FEMALE", "emotion": "thinking", "text": "A relatable wrong guess or expression of confusion"},
        {"speaker": "MALE", "emotion": "talking", "text": "The closing call to action challenge pushing for shares"}
      ]
    }

    STRICT CONTENT RULES (META 2026 UTIS COMPLIANCE):
    1. CRITICAL BAN ON ENGAGEMENT-BAIT: You are absolutely FORBIDDEN from using generic hype phrases like "Only 1% can solve this", "Only geniuses know this", "I bet $100 you will fail", or "Comment below to get pinned". The algorithm downranks this phrasing immediately.
    2. THE HOOK: The opening dialogue must state the riddle's actual high stakes, an intriguing logical claim, or a surprising visual setup directly tied to the specific twist of the riddle. Keep it under 3 seconds of pacing.
    3. MIX OF CASUAL & MATH RIDDLES: You must alternate between famous classic word riddles (e.g., candle, shadow, map) and clever mathematical/numerical logic riddles (e.g., divisibility constraints like "greater than 5, less than 15, only divisible by 3", sequence patterns, or numeric wordplay like "What is between 4 and 6 but is not 5? Answer: the word 'and'"). Keep them simple, engaging, and mind-bending.
    4. CAPTION AND HASHTAG HYGIENE: The caption field must be extremely brief and end with exactly 5 hashtags. Avoid spammy tags like #viral, #trending, #fbreels, #explore. Instead, use 2 riddle-centric tags (e.g., #riddles, #brainteasers) and 3 specific contextual tags defining the riddle's subject (e.g., if the riddle is about a river, use #river, #nature, #puzzle).
    5. UTIS COMPLIANCE COMMENT: The pinned_comment field must contain a unique, thought-provoking question or teaser derived organically from the riddle's logic. It must stimulate a genuine interest-driven response from the viewer (e.g., "If it has hands but can't clap, what else can it do? Lock your honest guess below!"). No templated or lazy CTAs allowed.
    6. SCRIPT PACING: Keep the overall script short and fast-paced (between 15 to 25 seconds estimated duration). Ensure word transitions are seamless for high-retention text-to-speech generation.


