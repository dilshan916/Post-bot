name: 2x Daily Conversational Reel Publisher

on:
  schedule:
    # Runs twice daily at 08:00 UTC (1:30 PM IST) and 20:00 UTC (1:30 AM IST)
    - cron: '0 8,20 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  auto_post_conversational:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Cache Kokoro Model Assets
        uses: actions/cache@v4
        with:
          path: assets/kokoro
          key: kokoro-assets-v0.19

      - name: Ensure Kokoro Assets
        run: |
          mkdir -p assets/kokoro
          if [ ! -f "assets/kokoro/kokoro-v0_19.onnx" ]; then
            echo "Downloading Kokoro ONNX model..."
            curl -sSL -H "User-Agent: Mozilla/5.0" "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files/kokoro-v0_19.onnx" -o "assets/kokoro/kokoro-v0_19.onnx"
          fi
          if [ ! -f "assets/kokoro/voices.bin" ]; then
            echo "Downloading Kokoro voices bin..."
            curl -sSL -H "User-Agent: Mozilla/5.0" "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files/voices.bin" -o "assets/kokoro/voices.bin"
          fi

      - name: Run Bot Auto-Post Pipeline (Conversational Mode)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACEBOOK_CONVERSATIONAL_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_CONVERSATIONAL_PAGE_ACCESS_TOKEN || secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_CONVERSATIONAL_PAGE_ID: ${{ secrets.FACEBOOK_CONVERSATIONAL_PAGE_ID || secrets.FACEBOOK_PAGE_ID }}
        run: |
          python main.py --mode conversational --batch 1

      - name: Commit Scraped History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/scraped_history.json || true
          git commit -m "auto: update scraped history [skip ci]" || echo "No changes to commit"
          git push || echo "No changes to push"
